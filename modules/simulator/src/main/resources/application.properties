# -----------------------------
# Application
# -----------------------------
spring.application.name=simulator

# -----------------------------curl kafka90
# Kafka
# -----------------------------
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# -----------------------------
# Kafka topic
# -----------------------------
kafka.topic.requested=market-requested
kafka.topic.referred=market-referred

# -----------------------------
# Simulator config
# -----------------------------
simulator.categories=6
simulator.manufacturers=18
simulator.products-per-category=6
simulator.popularity-range=18-90
simulator.default-scenario=CHAOS
simulator.generate-interval-ms=1200
simulator.click-probability=0.26
simulator.active-categories-per-tick=2
simulator.min-traffic-per-tick=24
simulator.max-traffic-per-tick=120
simulator.promo-duration-ticks=8
simulator.promo-boost-multiplier=3.4
simulator.auto-promo-probability=0.18
simulator.trend-duration-ticks=9
simulator.traffic-surge-probability=0.28
simulator.traffic-surge-multiplier=2.8
simulator.traffic-drop-probability=0.16
simulator.traffic-drop-multiplier=0.28
simulator.popularity-shock-probability=0.10
simulator.popularity-shock-multiplier=0.90
